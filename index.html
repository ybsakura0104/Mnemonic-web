<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>므네모닉 - 통합 프로토타입</title>
<style>
  @font-face{ font-family:'RIDIBatang'; src:url('assets/fonts/RIDIBatang.otf') format('opentype'); font-weight:normal; font-style:normal; }
  @font-face{ font-family:'Continuous'; src:url('assets/fonts/Continuous.ttf') format('truetype'); font-weight:normal; font-style:normal; }

  :root{
    --gold:#B8935A; --ink:#2A2620;
    --font-kr:'RIDIBatang', serif;
    --font-en:'Continuous', cursive;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%; width:100%; background:#000; overscroll-behavior:none;
    overflow:hidden; /* 스크롤바가 생기면 100vw/100vh가 실제 보이는 영역보다 커지는
                        브라우저 특성 때문에 우측/하단 여백이 생김 — 아예 스크롤 자체를 차단 */
  }
  body{ font-family:var(--font-kr); -webkit-user-select:none; user-select:none; }

  #viewport{ width:100%; height:100%; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#000; }
  #stage{ position:relative; width:1920px; height:1080px; flex-shrink:0; overflow:hidden; background:#000; cursor:pointer; }

  /* ================= 타이틀 화면 ================= */
  #titleScreen{
    position:absolute; inset:0; z-index:200;
    background-image:url('assets/img/title_bg.png'); background-size:cover; background-position:center;
  }
  #titleLogo{
    position:absolute; left:1340px; top:464px; width:513px; height:108px;
    background-image:url('assets/img/title_logo.png'); background-size:contain; background-repeat:no-repeat;
  }
  #startBtn{
    position:absolute; left:1340px; top:596px; width:513px;
    text-align:right;
    font-family:var(--font-kr); font-size:22px; letter-spacing:2px;
    color:#dfe6f5; cursor:pointer;
    padding:8px 4px;
    border-top:1px solid rgba(180,195,230,0.35);
    transition: color .2s ease, letter-spacing .2s ease;
  }
  #startBtn:hover{ color:#ffffff; letter-spacing:4px; }
  #titleScreen.hidden{ display:none; }

  /* ================= 배경 ================= */
  #bgLayer{ position:absolute; inset:0; z-index:0; background-size:cover; background-position:center; transition:opacity .25s ease; }

  /* ================= 캐릭터 ================= */
  #charLayer{ position:absolute; inset:0; z-index:10; pointer-events:none; }
  .char-sprite{
    position:absolute; bottom:0px; width:420px;
    opacity:0; transform:translate(-50%,12px);
    filter:brightness(0.42) saturate(0.55);
    transition:opacity .35s ease, transform .35s ease, filter .3s ease, left .4s ease;
  }
  .char-sprite.on{ opacity:1; transform:translate(-50%,0); }
  .char-sprite.active{ filter:brightness(1) saturate(1); }
  .char-sprite img{ width:100%; display:block; filter:drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
  .pos-left{ left:26%; } .pos-center{ left:50%; } .pos-right{ left:74%; }

  /* ================= UI_1 (대사-캐릭터 사이 남색 그라데이션, multiply) ================= */
  #ui1Layer{
    position:absolute; inset:0; z-index:20;
    background-image:url('assets/img/ui1.png'); background-size:cover; background-position:center;
    mix-blend-mode:multiply;
    opacity:0; transition:opacity .25s ease; pointer-events:none;
  }
  #ui1Layer.on{ opacity:1; }

  /* ================= 대사 텍스트 ================= */
  #dlgText{
    position:absolute; z-index:30;
    left:420px; right:90px; bottom:70px;
    color:#F7F3E7; font-size:27px; font-weight:700; line-height:1.65;
    min-height:1.6em; white-space:pre-line;
    opacity:0; transition:opacity .2s ease;
    text-shadow:0 2px 10px rgba(0,0,0,.85), 0 0 24px rgba(0,0,0,.5);
  }
  #dlgText.on{ opacity:1; }
  #dlgText.narration{ left:160px; right:160px; text-align:center; font-style:italic; font-weight:400; color:#D8D2BF; }
  #nextIndicator{
    position:absolute; z-index:31; right:100px; bottom:34px;
    color:var(--gold); font-size:20px; opacity:0;
    animation:bob 1.1s ease-in-out infinite;
  }
  #nextIndicator.show{ opacity:.9; }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(4px)} }

  /* ================= 초상화 ================= */
  #portrait{
    position:absolute; z-index:40; left:30px; bottom:60px;
    width:280px; height:280px; overflow:hidden;
    background-size:cover; background-position:top center;
    opacity:0; transition:opacity .2s ease;
    filter:drop-shadow(0 8px 16px rgba(0,0,0,.5));
  }
  #portrait.on{ opacity:1; }

  /* ================= UI_2 (이름표 배경판, 에셋 없어 CSS 대체) ================= */
  #nameTag{
    position:absolute; z-index:45; left:40px; bottom:14px;
    width:230px; height:70px;
    background-image:url('assets/img/ui2.png'); background-size:100% 100%; background-repeat:no-repeat;
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .2s ease;
  }
  #nameTag.on{ opacity:1; }

  /* ================= 이름 텍스트 ================= */
  #speakerName{
    position:relative; z-index:50;
    font-family:var(--font-kr); font-weight:700; font-size:24px;
    color:#2A2620; letter-spacing:1px; white-space:nowrap;
  }

  /* ================= 인터랙션(중앙 클릭) ================= */
  #interactBtn{
    position:absolute; z-index:60; left:50%; top:50%; transform:translate(-50%,-50%);
    padding:16px 30px; border:2px solid var(--gold); border-radius:32px;
    background:rgba(6,7,4,0.6); color:#F5EFDF; font-family:var(--font-kr); font-size:19px;
    cursor:pointer; opacity:0; pointer-events:none;
    animation:pulse 1.5s ease-in-out infinite;
    transition:opacity .2s ease;
  }
  #interactBtn.on{ opacity:1; pointer-events:auto; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(184,147,90,0.5);} 50%{ box-shadow:0 0 0 10px rgba(184,147,90,0);} }

  /* ================= ESC 버튼 & 음소거 ================= */
  #topRightBar{ position:absolute; z-index:70; top:14px; right:16px; display:flex; gap:8px; }
  #topRightBar button{
    all:unset; cursor:pointer; width:34px; height:34px; border-radius:50%;
    background:rgba(0,0,0,0.4); color:rgba(255,255,255,0.8);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-family:monospace;
  }

  /* ================= ESC 오버레이 ================= */
  #escBgLayer{
    position:absolute; inset:0; z-index:95;
    background-image:url('assets/img/ui_esc_bg.png'); background-size:cover;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  #escBgLayer.on{ opacity:.88; pointer-events:auto; }

  #escPanel{
    position:absolute; z-index:96;
    left:555px; top:65px; width:809px; height:979px;
    background-image:url('assets/img/ui_esc.png'); background-size:contain; background-repeat:no-repeat;
    opacity:0; transform:translateY(14px); pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  #escPanel.on{ opacity:1; transform:translateY(0); pointer-events:auto; }

  #escPhoto{
    position:absolute; left:132px; top:158px; width:198px; height:203px;
    background-size:cover; background-position:top center; border-radius:2px;
  }
  #escInfo{
    position:absolute; left:364px; top:161px; width:396px;
    font-size:17px; line-height:1.85; color:var(--ink);
  }
  #escInfo b{ display:inline-block; width:88px; }
  .escCore{
    position:absolute; width:103px; height:103px; top:454px;
    display:flex; align-items:center; justify-content:center;
    color:#EFE6D0; font-family:var(--font-kr); font-size:26px;
  }
  #escCore1{ left:166px; } #escCore2{ left:357px; } #escCore3{ left:549px; }

  /* 기타 옵션 (좌측 1칸, 실측상 안쪽 분리선이 없어 한 박스에 두 라벨을 배치) */
  .escLeftLabel{
    position:absolute; left:156px; width:227px;
    font-size:13.5px; color:var(--ink); line-height:1.5;
  }
  #escLeftLabel1{ top:613px; }
  #escLeftLabel2{ top:778px; border-top:1px solid rgba(42,38,32,.15); padding-top:10px; }
  .escLeftLabel .sub{ display:block; margin-top:4px; font-size:11px; color:#8a7f6a; }

  /* 세이브 파일 (우측) */
  #escSaveHeader{
    position:absolute; left:435px; top:613px;
    font-size:14px; font-weight:700; color:var(--ink);
  }
  .escSaveRow{
    position:absolute; left:435px; width:233px; height:56px;
    display:flex; flex-direction:column; justify-content:center; gap:2px;
    padding:0 4px;
  }
  #escSaveRow1{ top:654px; }
  #escSaveRow2{ top:738px; }
  #escSaveRow3{ top:810px; border-top:1px solid rgba(42,38,32,.15); padding-top:8px; }
  .escSaveRow .slotTag{ font-size:9.5px; color:#8a7f6a; letter-spacing:1px; }
  .escSaveRow .slotLine{ display:flex; justify-content:space-between; font-size:13px; color:var(--ink); }

  /* ================= 트랜지션 ================= */
  #transitionOverlay{
    position:absolute; inset:0; z-index:90; background:#000;
    opacity:0; pointer-events:none; transition:opacity .5s ease;
    display:flex; align-items:center; justify-content:center;
  }
  #transitionOverlay.on{ opacity:1; pointer-events:auto; }
  #transitionLabel{ font-family:var(--font-kr); color:#EFE6D0; font-size:34px; letter-spacing:6px; opacity:0; transition:opacity .4s ease .3s; }
  #transitionOverlay.on #transitionLabel{ opacity:1; }
</style>
</head>
<body>

<div id="viewport">
  <div id="stage">

    <div id="titleScreen">
      <div id="titleLogo"></div>
      <div id="startBtn">시작하기 ▸</div>
    </div>

    <div id="bgLayer"></div>
    <div id="charLayer">
      <div class="char-sprite pos-left"   data-id="player"><img src="assets/img/char_player.png" alt=""></div>
      <div class="char-sprite pos-right"  data-id="client"><img src="assets/img/char_client.png" alt=""></div>
    </div>
    <div id="ui1Layer"></div>

    <div id="dlgText"></div>
    <span id="nextIndicator">▼</span>
    <div id="portrait"></div>
    <div id="nameTag"><span id="speakerName"></span></div>

    <div id="interactBtn">▶</div>

    <div id="topRightBar">
      <button id="fsBtn" title="전체화면">⛶</button>
      <button id="muteBtn">♪</button>
      <button id="escBtn">ESC</button>
    </div>

    <div id="escBgLayer"></div>
    <div id="escPanel">
      <div id="escPhoto"></div>
      <div id="escInfo"></div>
      <div class="escCore" id="escCore1">?</div>
      <div class="escCore" id="escCore2">?</div>
      <div class="escCore" id="escCore3">?</div>

      <div class="escLeftLabel" id="escLeftLabel1">또 뭔 내용 들어가면 좋을까요<span class="sub">(추가 예정)</span></div>
      <div class="escLeftLabel" id="escLeftLabel2">여기에는 뭔 내용이 들어가면 좋을까요<span class="sub">(추가 예정)</span></div>

      <div id="escSaveHeader">세이브 파일</div>
      <div class="escSaveRow" id="escSaveRow1">
        <span class="slotTag">SAVE 1</span>
        <span class="slotLine"><span>파일 저장명</span><span>00:00</span></span>
      </div>
      <div class="escSaveRow" id="escSaveRow2">
        <span class="slotTag">SAVE 2</span>
        <span class="slotLine"><span>파일 저장명</span><span>00:00</span></span>
      </div>
      <div class="escSaveRow" id="escSaveRow3">
        <span class="slotTag">SAVE 3</span>
        <span class="slotLine"><span>파일 저장명</span><span>00:00</span></span>
      </div>
    </div>

    <div id="transitionOverlay"><span id="transitionLabel"></span></div>
  </div>
</div>

<audio id="bgm" loop src="assets/audio/bgm.mp3" style="display:none"></audio>
<audio id="titleBgm" loop src="assets/audio/title.mp3" style="display:none"></audio>

<script>
/* ===========================================================
   캔버스 배율 (에셋 원본 해상도 1456x840 기준)
   =========================================================== */
const BASE_W = 1920, BASE_H = 1108; /* 배경 이미지 원본 비율(1456:840)에 맞춤 */
const MIN_SCALE = 0.4, MAX_SCALE = 1.4;
const stageEl = document.getElementById('stage');
const viewportEl = document.getElementById('viewport');
function fitStage(rect){
  const w = rect ? rect.width  : viewportEl.getBoundingClientRect().width;
  const h = rect ? rect.height : viewportEl.getBoundingClientRect().height;
  const raw = Math.min(w/BASE_W, h/BASE_H);
  const scale = Math.max(MIN_SCALE, Math.min(raw, MAX_SCALE));
  stageEl.style.transform = `scale(${scale})`;
  stageEl.style.transformOrigin = 'center center';
}
new ResizeObserver((entries)=>{
  const r = entries[0].contentRect;
  requestAnimationFrame(()=>fitStage(r));
}).observe(viewportEl);
if(window.visualViewport) window.visualViewport.addEventListener('resize', ()=>requestAnimationFrame(()=>fitStage()));
window.addEventListener('orientationchange', ()=>requestAnimationFrame(()=>fitStage()));
fitStage();

/* ===========================================================
   BGM
   =========================================================== */
const bgm = document.getElementById('bgm');
const titleBgm = document.getElementById('titleBgm');
bgm.volume = 0.55;
titleBgm.volume = 0.6;
function tryPlayTitleBgm(){ titleBgm.play().catch((e)=>console.warn('타이틀 BGM 자동재생 차단됨:', e)); }
tryPlayTitleBgm(); // 우선 즉시 시도 (자동재생 정책에 막히면 아래 폴백이 처리)
// 브라우저가 자동재생을 막았을 경우, 페이지 첫 클릭(단 '시작하기' 버튼 제외)에서 재생 시도
window.addEventListener('pointerdown', (e)=>{
  if(e.target.closest('#startBtn')) return;
  if(!document.getElementById('titleScreen').classList.contains('hidden')) tryPlayTitleBgm();
}, { once:true });
document.getElementById('fsBtn').addEventListener('click', ()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen?.().catch(()=>{});
  } else {
    document.exitFullscreen?.();
  }
});
window.addEventListener('resize', ()=>requestAnimationFrame(()=>fitStage()));

document.getElementById('muteBtn').addEventListener('click', ()=>{
  bgm.muted = !bgm.muted;
  document.getElementById('muteBtn').textContent = bgm.muted ? '✕' : '♪';
});
function tryPlayBgm(){
  const p = bgm.play();
  if(p && p.catch){
    p.catch((err)=>{
      console.warn('BGM 자동재생 차단됨:', err);
      // 자동재생이 막힌 환경(브라우저 정책/미리보기 iframe 등)이면 수동 재생 버튼 노출
      const btn = document.getElementById('muteBtn');
      btn.textContent = '▶';
      btn.title = '클릭해서 BGM 재생';
      btn.onclick = ()=>{ bgm.play().catch(e=>console.warn('여전히 재생 불가:', e)); btn.onclick=null; btn.textContent='♪'; };
    });
  }
}

/* ===========================================================
   타이틀 화면
   =========================================================== */
document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('titleScreen').classList.add('hidden');
  titleBgm.pause();
  titleBgm.currentTime = 0;
  tryPlayBgm();
  runNext();
});

/* ===========================================================
   배경 레지스트리
   =========================================================== */
const BACKGROUNDS = {
  office2: { value:'assets/img/bg_office.png', label:'배경 : 사무실 (0챕터)' },
  counsel: { value:'assets/img/bg_counsel.png', label:'배경 : 상담실 (1챕터)' },
  dungeon_stub: { color:'#1b1f2e', label:'배경 : 던전(기억) — 단색 임시' },
};
const bgLayer = document.getElementById('bgLayer');
function applyBackground(key){
  const bg = BACKGROUNDS[key];
  if(!bg) return;
  bgLayer.style.opacity = 0;
  setTimeout(()=>{
    if(bg.color){ bgLayer.style.backgroundImage='none'; bgLayer.style.backgroundColor=bg.color; }
    else { bgLayer.style.backgroundColor='#000'; bgLayer.style.backgroundImage=`url('${bg.value}')`; }
    bgLayer.style.opacity = 1;
  }, 180);
}

/* ===========================================================
   캐릭터 정의
   =========================================================== */
const CHARACTERS = {
  player: { name:'주인공', portrait:'assets/img/char_player.png' },
  client: { name:'이소윤 (의뢰인)', portrait:'assets/img/char_client.png', age:'21세', reason:"어릴 적 가족과의 나쁜 기억 소거", done:'미완료' },
  youngClient: { name:'어린 이소윤', portrait:null },
};
const UNKNOWN = { name:'???', portrait:null };
function charOf(id){ return CHARACTERS[id] || UNKNOWN; }

function getSprite(id){ return document.querySelector(`.char-sprite[data-id="${id}"]`); }
function setActiveSpeaker(id){
  document.querySelectorAll('.char-sprite').forEach(el=>{
    el.classList.toggle('active', el.dataset.id===id && el.classList.contains('on'));
  });
}

/* ===========================================================
   ESC 메뉴 — 현재 케이스(의뢰인) 파일 표시
   =========================================================== */
let currentCase = 'client'; // 현재 챕터의 의뢰인 id
const escPhoto = document.getElementById('escPhoto');
const escInfo = document.getElementById('escInfo');
const escBgLayer = document.getElementById('escBgLayer');
const escPanel = document.getElementById('escPanel');
let escOpen = false;

function refreshEscPanel(){
  const c = charOf(currentCase);
  escPhoto.style.backgroundImage = c.portrait ? `url('${c.portrait}')` : 'none';
  escInfo.innerHTML = `
    <div><b>이름</b> ${c.name.replace(/\s*\(.*\)/,'')}</div>
    <div><b>나이</b> ${c.age||'?'}</div>
    <div style="margin-top:6px;"><b>방문 사유</b></div>
    <div style="color:#5C5342;">${c.reason||'-'}</div>
    <div style="margin-top:10px;"><b>소거 완료</b> ${c.done||'미완료'}</div>
  `;
}
function toggleEsc(force){
  escOpen = typeof force === 'boolean' ? force : !escOpen;
  escBgLayer.classList.toggle('on', escOpen);
  escPanel.classList.toggle('on', escOpen);
  if(escOpen) refreshEscPanel();
}
document.getElementById('escBtn').addEventListener('click', (e)=>{ e.stopPropagation(); toggleEsc(); });
escBgLayer.addEventListener('click', (e)=>{ if(e.target===escBgLayer) toggleEsc(false); });
window.addEventListener('keydown', (e)=>{ if(e.key==='Escape') toggleEsc(); });

/* ===========================================================
   시나리오 스크립트
   =========================================================== */
const SCRIPT = [
  { cmd:'setBackground', bg:'office2' },
  { cmd:'showCharacter', id:'player', pos:'left' },

  { cmd:'narration', text:'...' },
  { cmd:'narration', text:'..........' },
  { cmd:'say', id:'player', text:'................아.' },
  { cmd:'narration', text:'어렴풋이 들려오는 새소리에 천천히 눈을 뜬다.' },
  { cmd:'narration', text:'희미한 빛이 얼굴을 비추고, 잠기운을 서서히 몰아낸다.' },
  { cmd:'narration', text:'엎어져있어 뻐근해진 몸을 가볍게 풀고는 상체를 일으킨다.' },
  { cmd:'say', id:'player', text:'(설마 사무실에서 잠이 든건가?)' },
  { cmd:'say', id:'player', text:'윽, 머리야... 오늘은 뭘 해야했지?' },
  { cmd:'narration', text:'주인공은 흐린 눈을 몇 번 깜빡여 정신을 부여잡는다.' },
  { cmd:'narration', text:'눈 앞에 보이는 것은 익숙한 자신의 사무실 데스크와 그 위의 물건들.' },
  { cmd:'narration', text:'밤새 식어버린 커피컵과 방금 막 켜진 모니터가 눈에 띈다.' },
  { cmd:'say', id:'player', text:'음.' },
  { cmd:'narration', text:"파일명 '므네모닉(MNEMONIC)'." },
  { cmd:'interact', label:'메모 열람하기' },
  { cmd:'narration', text:"그곳에는 '기억 소거술'에 대해 적혀있다." },
  { cmd:'narration', text:'기억 소거술이란 무엇이며 그 방법은 무엇인지, 주의할 점은 무엇인지 등.' },
  { cmd:'narration', text:'말 그대로 대상자의 특정 기억을 소거하는 것. 그것이 기억 소거술이다.' },

/* ===========================================================
   엔진
   =========================================================== */
let idx = 0, typing = false, typeTimer = null;
const dlgTextEl = document.getElementById('dlgText');
const portraitEl = document.getElementById('portrait');
const nameTagEl = document.getElementById('nameTag');
const speakerNameEl = document.getElementById('speakerName');
const nextIndicator = document.getElementById('nextIndicator');
const interactBtn = document.getElementById('interactBtn');
const stage = document.getElementById('stage');
let interactActive = false;

const ui1Layer = document.getElementById('ui1Layer');
function showDialogueOn(){ dlgTextEl.classList.add('on'); portraitEl.classList.add('on'); nameTagEl.classList.add('on'); ui1Layer.classList.add('on'); }
function hideDialogueBox(){ dlgTextEl.classList.remove('on'); portraitEl.classList.remove('on'); nameTagEl.classList.remove('on'); ui1Layer.classList.remove('on'); }

function runCommand(step){
  switch(step.cmd){
    case 'setBackground': applyBackground(step.bg); idx++; runNext(); break;

    case 'showCharacter': { const sp = getSprite(step.id); if(sp) sp.classList.add('on'); idx++; runNext(); break; }
    case 'hideCharacter': { const sp = getSprite(step.id); if(sp) sp.classList.remove('on'); idx++; runNext(); break; }

    case 'say': {
      dlgTextEl.classList.remove('narration');
      showDialogueOn();
      const c = charOf(step.id);
      speakerNameEl.textContent = c.name;
      portraitEl.style.backgroundImage = c.portrait ? `url('${c.portrait}')` : 'none';
      setActiveSpeaker(step.id);
      typeText(step.text);
      break;
    }
    case 'narration': {
      showDialogueOn();
      dlgTextEl.classList.add('narration');
      portraitEl.classList.remove('on'); nameTagEl.classList.remove('on');
      setActiveSpeaker(null);
      typeText(step.text);
      break;
    }
    case 'interact': {
      hideDialogueBox();
      interactActive = true;
      interactBtn.textContent = '▶ ' + (step.label || '계속하기');
      interactBtn.classList.add('on');
      break;
    }
    case 'transition': {
      const overlay = document.getElementById('transitionOverlay');
      const label = document.getElementById('transitionLabel');
      label.textContent = step.label || '';
      overlay.classList.add('on');
      setTimeout(()=>{
        if(step.bg) applyBackground(step.bg);
        document.querySelectorAll('.char-sprite').forEach(el=>el.classList.remove('on','active'));
        setTimeout(()=>{ overlay.classList.remove('on'); }, 700);
      }, 550);
      setTimeout(()=>{ idx++; runNext(); }, 1500);
      break;
    }
    case 'setMode':
      if(step.mode === 'end'){ hideDialogueBox(); }
      break;
  }
}

function typeText(full){
  typing = true; nextIndicator.classList.remove('show'); dlgTextEl.textContent='';
  let i=0; clearInterval(typeTimer);
  typeTimer = setInterval(()=>{
    dlgTextEl.textContent = full.slice(0, ++i);
    if(i>=full.length){ clearInterval(typeTimer); typing=false; nextIndicator.classList.add('show'); }
  }, 24);
}

function runNext(){ if(idx>=SCRIPT.length) return; runCommand(SCRIPT[idx]); }

function advance(){
  if(escOpen) return;
  if(interactActive) return;
  const step = SCRIPT[idx];
  if(step && (step.cmd==='say' || step.cmd==='narration')){
    if(typing){ clearInterval(typeTimer); dlgTextEl.textContent=step.text; typing=false; nextIndicator.classList.add('show'); return; }
    idx++; runNext(); return;
  }
}
stage.addEventListener('click', (e)=>{
  if(e.target.closest('#topRightBar') || e.target.closest('#escPanel') || e.target.closest('#interactBtn') || e.target.closest('#titleScreen')) return;
  advance();
});
interactBtn.addEventListener('click', ()=>{
  interactActive = false;
  interactBtn.classList.remove('on');
  idx++; runNext();
});
</script>
